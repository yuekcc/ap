<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ap-web</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f6f5f2;
    color: #1f1d1a;
  }
  main { max-width: 34rem; padding: 2rem; }
  h1 { margin: 0 0 0.5rem; font-size: 1.6rem; letter-spacing: -0.02em; }
  p { margin: 0.4rem 0; line-height: 1.6; color: #55514b; }
  code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 0.9em; }
</style>
</head>
<body>
<main>
  <h1>ap-web 已启动</h1>
  <p>这是占位页面。Web UI、会话列表与事件流会在后续工单接入。</p>
  <p>静态资源内置在 <code>ap-web.exe</code> 中；开发时可用 <code>--web-root ap-web/dist</code> 改走磁盘。</p>
</main>
</body>
</html>
