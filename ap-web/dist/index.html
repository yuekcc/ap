<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ap</title>
<meta name="application-name" content="ap-web">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/styles.css">
<script defer src="/app.js"></script>
</head>
<body x-data="apApp" x-init="init()" x-cloak>

<div class="app">
  <header class="titlebar">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">ap</span>
    </div>

    <nav class="workspaces" aria-label="工作空间">
      <template x-for="project in $store.ap.workspaceProjects" :key="project.cwd">
        <button
          class="workspace-tab"
          type="button"
          :class="{ 'is-active': isActiveProject(project) }"
          :title="project.cwd"
          :disabled="$store.ap.loading"
          @click="switchWorkspace(project)"
        >
          <svg class="workspace-tab__icon" viewBox="0 0 16 16" fill="currentColor" data-icon="folder2" aria-hidden="true"><path d="M1 3.5A1.5 1.5 0 0 1 2.5 2h2.764c.958 0 1.76.56 2.311 1.184C7.985 3.648 8.48 4 9 4h4.5A1.5 1.5 0 0 1 15 5.5v7a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 12.5zM2.5 3a.5.5 0 0 0-.5.5V6h12v-.5a.5.5 0 0 0-.5-.5H9c-.964 0-1.71-.629-2.174-1.154C6.374 3.334 5.82 3 5.264 3zM14 7H2v5.5a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 .5-.5z"/></svg>
          <span class="workspace-tab__name" x-text="projectName(project)"></span>
        </button>
      </template>
    </nav>

    <button
      class="workspace-add"
      type="button"
      @click="openWorkspace()"
      :disabled="$store.ap.loading || $store.ap.picking"
      title="打开新的工作空间"
      aria-label="打开新的工作空间"
    >
      <svg viewBox="0 0 16 16" fill="currentColor" data-icon="plus-lg" aria-hidden="true"><path fill-rule="evenodd" d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"/></svg>
    </button>

    <div class="titlebar__open">
      <button
        class="titlebar__open-btn"
        type="button"
        @click="openWorkdirFiles()"
        :disabled="!$store.ap.projectCwd"
        title="在文件管理器中打开工作目录"
        aria-label="在文件管理器中打开工作目录"
      >
        <svg viewBox="0 0 16 16" fill="currentColor" data-icon="folder2-open" aria-hidden="true"><path d="M1 3.5A1.5 1.5 0 0 1 2.5 2h2.764c.958 0 1.76.56 2.311 1.184C7.985 3.648 8.48 4 9 4h4.5A1.5 1.5 0 0 1 15 5.5v.64c.57.265.94.876.856 1.546l-.64 5.124A2.5 2.5 0 0 1 12.733 15H3.266a2.5 2.5 0 0 1-2.481-2.19l-.64-5.124A1.5 1.5 0 0 1 1 6.14zM2 6h12v-.5a.5.5 0 0 0-.5-.5H9c-.964 0-1.71-.629-2.174-1.154C6.374 3.334 5.82 3 5.264 3H2.5a.5.5 0 0 0-.5.5zm-.367 1a.5.5 0 0 0-.496.562l.64 5.124A1.5 1.5 0 0 0 3.266 14h9.468a1.5 1.5 0 0 0 1.489-1.314l.64-5.124A.5.5 0 0 0 14.367 7z"/></svg>
      </button>
      <button
        class="titlebar__open-btn"
        type="button"
        @click="openWorkdirTerminal()"
        :disabled="!$store.ap.projectCwd"
        title="在工作目录打开终端"
        aria-label="在工作目录打开终端"
      >
        <svg viewBox="0 0 16 16" fill="currentColor" data-icon="terminal" aria-hidden="true"><path d="M6 9a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3A.5.5 0 0 1 6 9M3.854 4.146a.5.5 0 1 0-.708.708L4.793 6.5 3.146 8.146a.5.5 0 1 0 .708.708l2-2a.5.5 0 0 0 0-.708z"/>
  <path d="M2 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2zm12 1a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/></svg>
      </button>
    </div>
  </header>

  <div class="app__body">
    <aside class="sidebar">
      <button
        class="new-session"
        type="button"
        @click="newSession()"
        :disabled="$store.ap.loading"
      >
        <svg class="new-session__icon" viewBox="0 0 16 16" fill="currentColor" data-icon="plus-lg" aria-hidden="true"><path fill-rule="evenodd" d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"/></svg>
        开启新对话
      </button>

      <p class="sidebar__label">对话记录</p>

      <nav class="sessions" aria-label="对话记录">
        <button
          class="session session--draft is-active"
          type="button"
          x-show="showsDraftSession()"
          :disabled="$store.ap.loading"
          title="新会话"
          @click="newSession()"
        >
          <span class="session__title" x-text="$store.ap.sessionId ? sessionTitle({ session_id: $store.ap.sessionId }) : '新会话'"></span>
          <span class="session__meta" x-text="$store.ap.running ? '运行中' : '尚未开始'"></span>
        </button>

        <template x-for="group in $store.ap.sessionGroups" :key="group.key">
          <section class="session-group">
            <p class="session-group__label" x-text="group.label"></p>
            <template x-for="session in group.sessions" :key="session.session_id">
              <button
                class="session"
                type="button"
                :class="{ 'is-active': session.session_id === $store.ap.sessionId }"
                :disabled="$store.ap.loading"
                :title="session.session_id"
                @click="selectSession(session)"
              >
                <span class="session__title" x-text="sessionTitle(session)"></span>
                <span class="session__meta" x-text="sessionMeta(session)"></span>
              </button>
            </template>
          </section>
        </template>

        <p class="sessions__empty" x-show="showsEmptySessions()">暂无对话</p>
      </nav>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar__heading">
          <h1 class="topbar__title" x-text="$store.ap.currentTitle"></h1>
          <button
            class="topbar__title-btn"
            type="button"
            @click="refreshTitle()"
            :disabled="$store.ap.running || $store.ap.loading || titlePending || !$store.ap.sessionId"
            title="重新生成会话标题"
            aria-label="重新生成会话标题"
          >
            <svg viewBox="0 0 16 16" fill="currentColor" data-icon="arrow-clockwise" aria-hidden="true"><path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/>
  <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/></svg>
          </button>
        </div>
        <div class="topbar__right">
          <span class="chip" x-show="$store.ap.config?.model" x-text="$store.ap.config?.model"></span>
          <span class="chip" x-show="$store.ap.config?.agent" x-text="$store.ap.config?.agent"></span>
          <span
            class="chip chip--usage"
            x-show="$store.ap.usageLabel"
            :title="$store.ap.usageTitle"
            x-text="$store.ap.usageLabel"
          ></span>
          <span class="status" :data-state="$store.ap.statusKind" x-text="$store.ap.statusLabel"></span>
        </div>
      </header>

      <main class="messages" x-ref="messages">
        <div class="messages__empty" x-show="$store.ap.items.length === 0">
          <span class="messages__empty-mark" aria-hidden="true">a</span>
          <p class="messages__empty-title">今天要做什么？</p>
          <p class="messages__empty-hint" x-show="$store.ap.loading">正在载入会话…</p>
          <p class="messages__empty-hint" x-show="!$store.ap.loading">输入提示词，ap 会在当前工作目录里开始一轮。</p>
        </div>

        <template x-for="item in $store.ap.items" :key="item.key">
          <div class="event">
            <template x-if="item.kind === 'user'">
              <article class="msg msg--user">
                <p class="msg__text" x-text="item.text"></p>
              </article>
            </template>

            <template x-if="item.kind === 'assistant'">
              <article class="msg msg--assistant">
                <div
                  class="msg__text msg__text--markdown markdown-body"
                  :class="{ 'is-streaming': !item.ended }"
                  x-html="renderMarkdown(item.text)"
                ></div>
              </article>
            </template>

            <template x-if="item.kind === 'tool'">
              <details class="tool" :data-status="item.status">
                <summary class="tool__head" :title="item.args || item.name">
                  <span class="tool__dot" aria-hidden="true"></span>
                  <span class="tool__name" x-text="item.name"></span>
                  <span class="tool__args" x-show="item.args" x-text="item.args"></span>
                  <span class="tool__meta" x-show="item.durationMs !== null" x-text="formatDuration(item.durationMs)"></span>
                  <span class="tool__meta" x-show="item.exitCode !== null" x-text="'exit ' + item.exitCode"></span>
                  <svg class="tool__chevron" viewBox="0 0 16 16" fill="currentColor" data-icon="chevron-right" aria-hidden="true"><path fill-rule="evenodd" d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708"/></svg>
                </summary>
                <pre class="tool__output" x-show="item.streamed || item.result" x-text="item.streamed || item.result"></pre>
                <p class="tool__error" x-show="item.error" x-text="item.error"></p>
                <p class="tool__note" x-show="item.truncated">… 已截断，完整内容在 transcript</p>
              </details>
            </template>

            <template x-if="item.kind === 'notice'">
              <p class="notice" :data-tone="item.tone" x-text="item.text"></p>
            </template>
          </div>
        </template>

        <div class="thinking" x-show="$store.ap.thinking" aria-live="polite">
          <span class="thinking__dots" aria-hidden="true"><span></span><span></span><span></span></span>
          <span>思考中</span>
        </div>
      </main>

      <footer class="composer">
        <div class="composer__box">
          <label class="visually-hidden" for="prompt">提示词</label>
          <textarea
            id="prompt"
            class="composer__input"
            x-ref="input"
            rows="1"
            x-model="$store.ap.draft"
            @keydown="onKeydown($event)"
            :disabled="$store.ap.loading"
            placeholder="给 ap 一个提示词…（Enter 发送 · Shift+Enter 换行）"
          ></textarea>

          <div class="composer__bar">
            <div class="composer__actions">
              <span
                class="composer__cwd"
                x-show="$store.ap.projectCwd ?? $store.ap.config?.cwd"
                :title="$store.ap.projectCwd ?? $store.ap.config?.cwd ?? ''"
                x-text="$store.ap.projectCwd ?? $store.ap.config?.cwd ?? ''"
              ></span>
              <button
                class="control composer__handoff"
                type="button"
                @click="sendHandoff()"
                :disabled="$store.ap.running || $store.ap.loading || !$store.ap.sessionId"
                title="把当前会话交接给一个新会话；输入框里的文字会作为交接后的首个提示词"
              >
                <svg viewBox="0 0 16 16" fill="currentColor" data-icon="box-arrow-right" aria-hidden="true"><path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"/>
  <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/></svg>
                交接
              </button>
            </div>

            <div class="composer__buttons">
              <button
                class="control composer__stop"
                type="button"
                x-show="$store.ap.running"
                @click="cancel"
                :disabled="$store.ap.cancelling"
                title="停止当前 turn"
              >
                <span class="composer__stop-mark" aria-hidden="true"><svg viewBox="0 0 16 16" fill="currentColor" data-icon="stop-fill"><path d="M5 3.5h6A1.5 1.5 0 0 1 12.5 5v6a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 11V5A1.5 1.5 0 0 1 5 3.5"/></svg></span>
                <span x-text="$store.ap.cancelling ? '取消中' : '停止'"></span>
              </button>
              <button
                class="composer__send"
                type="button"
                @click="send"
                :disabled="$store.ap.running || $store.ap.loading || !$store.ap.draft.trim()"
                aria-label="发送"
                title="发送"
              >
                <svg viewBox="0 0 16 16" fill="currentColor" data-icon="arrow-up" aria-hidden="true"><path fill-rule="evenodd" d="M8 15a.5.5 0 0 0 .5-.5V2.707l3.146 3.147a.5.5 0 0 0 .708-.708l-4-4a.5.5 0 0 0-.708 0l-4 4a.5.5 0 1 0 .708.708L7.5 2.707V14.5a.5.5 0 0 0 .5.5"/></svg>
              </button>
            </div>
          </div>
        </div>

      </footer>
    </div>
  </div>
</div>

</body>
</html>
