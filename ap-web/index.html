<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ap</title>
<meta name="application-name" content="ap-web">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/styles.css">
<script defer src="/app.js"></script>
</head>
<body x-data="apApp" x-init="init()" x-cloak>

<aside class="sidebar">
  <div class="sidebar__head">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">a</span>
      <span class="brand__name">ap</span>
    </div>
    <span class="sidebar__env">local</span>
  </div>

  <button
    class="new-session"
    type="button"
    @click="newSession"
    :disabled="$store.ap.loading"
  >
    <svg class="new-session__icon" viewBox="0 0 16 16" aria-hidden="true">
      <path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    新会话
  </button>

  <p class="sidebar__label">最近会话</p>

  <nav class="sessions" aria-label="会话列表">
    <template x-for="session in $store.ap.sessions" :key="session.session_id">
      <button
        class="session"
        type="button"
        :class="{ 'is-active': session.session_id === $store.ap.sessionId }"
        :disabled="$store.ap.loading"
        :title="session.session_id"
        @click="selectSession(session.session_id)"
      >
        <span class="session__title" x-text="sessionTitle(session)"></span>
        <span class="session__meta" x-text="sessionMeta(session)"></span>
      </button>
    </template>
    <p class="sessions__empty" x-show="$store.ap.sessions.length === 0">还没有会话</p>
  </nav>

  <div class="sidebar__foot">
    <div class="sidebar__cwd" :title="$store.ap.config?.cwd ?? ''">
      <span class="sidebar__cwd-label">cwd</span>
      <span class="sidebar__cwd-path" x-text="$store.ap.config?.cwd ?? ''"></span>
    </div>
  </div>
</aside>

<div class="workspace">
  <header class="topbar">
    <h1 class="topbar__title" x-text="$store.ap.currentTitle"></h1>
    <div class="topbar__right">
      <span class="chip" x-show="$store.ap.config?.model" x-text="$store.ap.config?.model"></span>
      <span class="chip" x-show="$store.ap.config?.agent" x-text="$store.ap.config?.agent"></span>
      <span class="status" :data-state="$store.ap.statusKind" x-text="$store.ap.statusLabel"></span>
    </div>
  </header>

  <main class="messages" x-ref="messages">
    <div class="messages__empty" x-show="$store.ap.items.length === 0">
      <span class="messages__empty-mark" aria-hidden="true">a</span>
      <p class="messages__empty-title">今天要做什么？</p>
      <p class="messages__empty-hint" x-show="$store.ap.loading">正在载入会话…</p>
      <p class="messages__empty-hint" x-show="!$store.ap.loading">输入提示词，ap 会在当前工作目录里开始一轮。</p>
    </div>

    <template x-for="item in $store.ap.items" :key="item.key">
      <div class="event">
        <template x-if="item.kind === 'user'">
          <article class="msg msg--user">
            <p class="msg__text" x-text="item.text"></p>
          </article>
        </template>

        <template x-if="item.kind === 'assistant'">
          <article class="msg msg--assistant">
            <div
              class="msg__text msg__text--markdown markdown-body"
              :class="{ 'is-streaming': !item.ended }"
              x-html="renderMarkdown(item.text)"
            ></div>
          </article>
        </template>

        <template x-if="item.kind === 'tool'">
          <article class="tool" :data-status="item.status">
            <header class="tool__head">
              <span class="tool__dot" aria-hidden="true"></span>
              <span class="tool__name" x-text="item.name"></span>
              <span class="tool__args" x-show="item.args" x-text="item.args"></span>
              <span class="tool__meta" x-show="item.durationMs !== null" x-text="item.durationMs + 'ms'"></span>
              <span class="tool__meta" x-show="item.exitCode !== null" x-text="'exit ' + item.exitCode"></span>
            </header>
            <pre class="tool__output" x-show="item.streamed || item.result" x-text="item.streamed || item.result"></pre>
            <p class="tool__error" x-show="item.error" x-text="item.error"></p>
            <p class="tool__note" x-show="item.truncated">… 已截断，完整内容在 transcript</p>
          </article>
        </template>

        <template x-if="item.kind === 'notice'">
          <p class="notice" :data-tone="item.tone" x-text="item.text"></p>
        </template>
      </div>
    </template>
  </main>

  <footer class="composer">
    <div class="composer__box">
      <label class="visually-hidden" for="prompt">提示词</label>
      <textarea
        id="prompt"
        class="composer__input"
        x-ref="input"
        rows="1"
        x-model="$store.ap.draft"
        @keydown="onKeydown($event)"
        :disabled="$store.ap.loading"
        placeholder="给 ap 一个提示词…"
      ></textarea>

      <div class="composer__bar">
        <div class="composer__actions">
          <button
            class="control"
            type="button"
            x-show="$store.ap.isWindows"
            @click="pickDirectory"
            :disabled="$store.ap.running || $store.ap.picking"
            title="选择工作目录"
          >
            <svg class="control__icon" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M1.8 4.2c0-.6.5-1 1-1h3l1.3 1.6h6.1c.6 0 1 .4 1 1v6c0 .6-.4 1-1 1H2.8c-.5 0-1-.4-1-1V4.2Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
            </svg>
            <span x-text="$store.ap.picking ? '选择中…' : '选择目录'"></span>
          </button>
          <span
            class="composer__cwd"
            x-show="$store.ap.config?.cwd"
            :title="$store.ap.config?.cwd ?? ''"
            x-text="$store.ap.config?.cwd ?? ''"
          ></span>
        </div>

        <div class="composer__buttons">
          <button
            class="control composer__stop"
            type="button"
            x-show="$store.ap.running"
            @click="cancel"
            :disabled="$store.ap.cancelling"
            title="停止当前 turn"
          >
            <span class="composer__stop-mark" aria-hidden="true"></span>
            <span x-text="$store.ap.cancelling ? '取消中' : '停止'"></span>
          </button>
          <button
            class="composer__send"
            type="button"
            @click="send"
            :disabled="$store.ap.running || $store.ap.loading || !$store.ap.draft.trim()"
            aria-label="发送"
            title="发送"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M8 13V3.5M3.8 7.7 8 3.5l4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <p class="composer__hint">Enter 发送 · Shift+Enter 换行</p>
  </footer>
</div>

</body>
</html>
