<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ap</title>
<meta name="application-name" content="ap-web">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/styles.css">
<script defer src="/app.js"></script>
</head>
<body>

<!--
  静态骨架 + <template>。页面不跑任何模板运行时：frontend/ui/*.js 在挂载时取
  [data-ref] 节点、克隆模板，再用 signal effect 写 textContent / 属性。
  条目按 key 插入到下面两个注释锚点之前；注释不参与 :nth-last-child。
-->
<div class="app" data-ref="app">

  <!-- 三栏工作台：工作空间栏 / 对话栏 / 对话正文。 -->
  <aside class="rail" id="workspace-rail" aria-label="工作空间" data-ref="rail">
    <div class="rail__head">
      <span class="brand__mark" aria-hidden="true">ap</span>
      <div class="rail__actions">
        <button
          class="icon-btn"
          type="button"
          data-ref="rail-open-workspace"
          title="打开新的工作空间"
          aria-label="打开新的工作空间"
        >
          <svg viewBox="0 0 16 16" fill="currentColor" data-icon="plus-lg" aria-hidden="true"></svg>
        </button>

        <div class="rail__sort" data-ref="sort-root">
          <button
            class="icon-btn"
            type="button"
            id="sort-trigger"
            data-ref="sort-trigger"
            aria-expanded="false"
            aria-controls="sort-menu"
            title="排序：最近活动"
            aria-label="排序：最近活动"
          >
            <svg viewBox="0 0 16 16" fill="currentColor" data-icon="arrow-down-up" aria-hidden="true"></svg>
          </button>
          <!-- 两个互斥的开关按钮。这里不用 role="menu"：菜单语义要求方向键导航，
               而我们只是个两选项的排序面板，用 aria-pressed 说明当前选中项。 -->
          <div class="menu" id="sort-menu" data-ref="sort-menu" hidden aria-label="排序">
            <button class="menu__item" type="button" data-sort="recent" aria-pressed="false">最近活动</button>
            <button class="menu__item" type="button" data-sort="name" aria-pressed="false">名称</button>
          </div>
        </div>

        <button
          class="icon-btn"
          type="button"
          data-ref="rail-toggle"
          aria-expanded="true"
          aria-controls="workspace-rail"
          title="折叠工作空间栏"
          aria-label="折叠工作空间栏"
        >
          <svg viewBox="0 0 16 16" fill="currentColor" data-icon="layout-sidebar-inset" aria-hidden="true"></svg>
        </button>
      </div>
    </div>

    <nav class="rail__list" data-ref="workspace-list" aria-label="工作空间"></nav>
  </aside>

  <!-- 栏宽分隔条：tabindex 加 role="separator"，指针拖动和方向键都能调。 -->
  <div
    class="resizer"
    role="separator"
    aria-orientation="vertical"
    aria-label="工作空间栏宽度"
    aria-valuemin="176"
    aria-valuemax="420"
    aria-valuenow="260"
    data-panel="rail"
    data-ref="rail-resizer"
    tabindex="0"
    title="拖动调整宽度 · 双击恢复默认"
  ></div>

  <aside class="sessions-col" id="session-sidebar" data-ref="sessions-col">
    <div class="sessions__head">
      <button
        class="icon-btn"
        type="button"
        data-ref="rail-expand"
        hidden
        aria-expanded="true"
        aria-controls="workspace-rail"
        title="展开工作空间栏"
        aria-label="展开工作空间栏"
      >
        <svg viewBox="0 0 16 16" fill="currentColor" data-icon="layout-sidebar-inset" aria-hidden="true"></svg>
      </button>
      <p class="sessions__label">对话</p>
      <div class="sessions__actions">
        <button
          class="icon-btn"
          type="button"
          data-ref="open-files"
          title="在当前工作目录打开文件管理器"
          aria-label="在当前工作目录打开文件管理器"
        >
          <svg viewBox="0 0 16 16" fill="currentColor" data-icon="folder2-open" aria-hidden="true"></svg>
        </button>
        <button
          class="icon-btn"
          type="button"
          data-ref="open-terminal"
          title="在当前工作目录打开终端"
          aria-label="在当前工作目录打开终端"
        >
          <svg viewBox="0 0 16 16" fill="currentColor" data-icon="terminal" aria-hidden="true"></svg>
        </button>
      </div>
    </div>

    <button class="new-session" type="button" data-ref="new-session">
      <svg class="new-session__icon" viewBox="0 0 16 16" fill="currentColor" data-icon="plus-lg" aria-hidden="true"></svg>
      新对话
    </button>

    <nav class="sessions" data-ref="session-list" aria-label="对话记录">
      <!-- 新 slot 尚未落盘时的占位会话；真实对话按时间分组插到锚点之前。 -->
      <button class="session session--draft" type="button" data-ref="session-draft" hidden title="新会话">
        <span class="session__title" data-ref="session-draft-title"></span>
        <span class="session__foot">
          <span class="session__time" data-ref="session-draft-time"></span>
          <span class="session__dot" data-ref="session-draft-dot" aria-hidden="true"></span>
        </span>
      </button>

      <!-- session-groups-anchor -->

      <p class="sessions__empty" data-ref="sessions-empty" hidden>暂无对话</p>
    </nav>
  </aside>

  <div
    class="resizer"
    role="separator"
    aria-orientation="vertical"
    aria-label="对话栏宽度"
    aria-valuemin="176"
    aria-valuemax="420"
    aria-valuenow="260"
    data-panel="sessions"
    data-ref="sessions-resizer"
    tabindex="0"
    title="拖动调整宽度 · 双击恢复默认"
  ></div>

  <div class="workspace">
    <header class="topbar">
      <button
        class="icon-btn topbar__sessions-btn"
        type="button"
        data-ref="topbar-sessions-btn"
        hidden
        aria-expanded="true"
        aria-controls="session-sidebar"
        title="对话记录"
        aria-label="对话记录"
      >
        <svg viewBox="0 0 16 16" fill="currentColor" data-icon="list" aria-hidden="true"></svg>
      </button>

      <div class="topbar__heading">
        <h1 class="topbar__title" data-ref="topbar-title"></h1>
        <button
          class="topbar__title-btn"
          type="button"
          data-ref="topbar-title-btn"
          title="重新生成会话标题"
          aria-label="重新生成会话标题"
        >
          <svg viewBox="0 0 16 16" fill="currentColor" data-icon="arrow-clockwise" aria-hidden="true"></svg>
        </button>
      </div>

      <div class="topbar__right">
        <span
          class="status"
          data-ref="status"
          data-state="connecting"
          title="连接中"
          aria-label="连接中"
        ></span>
        <span class="chip chip--usage" data-ref="usage" hidden></span>
      </div>
    </header>

    <div class="thread">
      <!-- 本会话最近一次被改写的文件；点击复制完整路径。 -->
      <div class="thread-file" data-ref="thread-file" hidden>
        <button class="thread-file__btn" type="button" data-ref="thread-file-btn" title="">
          <svg viewBox="0 0 16 16" fill="currentColor" data-icon="file-earmark-code" aria-hidden="true"></svg>
          <span class="thread-file__name" data-ref="thread-file-name"></span>
        </button>
      </div>

      <main class="messages" data-ref="messages" aria-busy="false">
        <div class="messages__empty" data-ref="messages-empty">
          <span class="messages__empty-mark" aria-hidden="true">a</span>
          <p class="messages__empty-title">今天要做什么？</p>
          <p class="messages__empty-hint" data-ref="messages-empty-loading" hidden>正在载入会话…</p>
          <p class="messages__empty-hint" data-ref="messages-empty-hint">输入提示词，ap 会在当前工作目录里开始一轮。</p>
        </div>

        <!-- messages-anchor -->

        <div class="thinking" data-ref="thinking" hidden aria-live="polite">
          <span class="thinking__dots" aria-hidden="true"><span></span><span></span><span></span></span>
          <span>思考中</span>
        </div>
      </main>

      <button
        class="scroll-bottom"
        type="button"
        data-ref="scroll-bottom"
        hidden
        aria-label="回到底部"
        title="回到底部"
      >
        <svg viewBox="0 0 16 16" fill="currentColor" data-icon="arrow-down" aria-hidden="true"></svg>
      </button>
    </div>

    <footer class="composer">
      <div class="composer__box">
        <label class="visually-hidden" for="prompt">提示词</label>
        <textarea
          id="prompt"
          class="composer__input"
          data-ref="prompt"
          rows="1"
          placeholder="给 ap 一个提示词…（Enter 发送 · Shift+Enter 换行）"
        ></textarea>

        <div class="composer__bar">
          <div class="composer__actions">
            <span class="composer__cwd" data-ref="composer-cwd" hidden></span>
          </div>

          <div class="composer__buttons">
            <button
              class="control composer__handoff"
              type="button"
              data-ref="handoff"
              title="把当前会话交接给一个新会话；输入框里的文字会作为交接后的首个提示词"
            >
              <svg viewBox="0 0 16 16" fill="currentColor" data-icon="box-arrow-right" aria-hidden="true"></svg>
              交接
            </button>
            <button
              class="control composer__stop"
              type="button"
              data-ref="stop"
              hidden
              title="停止当前 turn"
            >
              <span class="composer__stop-mark" aria-hidden="true"><svg viewBox="0 0 16 16" fill="currentColor" data-icon="stop-fill"></svg></span>
              <span data-ref="stop-label">停止</span>
            </button>
            <button
              class="composer__send"
              type="button"
              data-ref="send"
              aria-label="发送"
              title="发送"
            >
              <svg viewBox="0 0 16 16" fill="currentColor" data-icon="arrow-up" aria-hidden="true"></svg>
            </button>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <div class="scrim" data-ref="scrim" hidden aria-hidden="true"></div>
</div>

<!-- ---------------------------------------------------------------------- -->
<!-- 重复结构：ui/*.js 用 cloneTemplate 克隆，用户数据只经 textContent 写入。 -->
<!-- ---------------------------------------------------------------------- -->

<template id="tpl-workspace-item">
  <button class="workspace-item" type="button" title="">
    <svg class="workspace-item__icon" viewBox="0 0 16 16" fill="currentColor" data-icon="folder2" aria-hidden="true"></svg>
    <span class="workspace-item__name" data-ref="name"></span>
  </button>
</template>

<template id="tpl-session-group">
  <div class="session-group">
    <p class="session-group__label" data-ref="label"></p>
  </div>
</template>

<template id="tpl-session-item">
  <button class="session" type="button" title="">
    <span class="session__title" data-ref="title"></span>
    <span class="session__foot">
      <span class="session__time" data-ref="time"></span>
      <span class="session__dot" data-ref="dot" hidden aria-hidden="true"></span>
    </span>
  </button>
</template>

<template id="tpl-message-user">
  <div class="event">
    <article class="msg msg--user">
      <p class="msg__text" data-ref="text" data-render="text"></p>
    </article>
  </div>
</template>

<template id="tpl-message-assistant">
  <div class="event">
    <article class="msg msg--assistant">
      <div
        class="msg__text msg__text--markdown markdown-body"
        data-ref="body"
        data-render="markdown"
      ></div>
    </article>
  </div>
</template>

<template id="tpl-tool-card">
  <div class="event">
    <details class="tool" data-ref="tool" data-status="running">
      <summary class="tool__head" data-ref="head" title="">
        <span class="tool__dot" aria-hidden="true"></span>
        <span class="tool__name" data-ref="name"></span>
        <span class="tool__args" data-ref="args" hidden></span>
        <span class="tool__meta" data-ref="duration" hidden></span>
        <span class="tool__meta" data-ref="exit" hidden></span>
        <svg class="tool__chevron" viewBox="0 0 16 16" fill="currentColor" data-icon="chevron-right" aria-hidden="true"></svg>
      </summary>
      <pre class="tool__output" data-ref="output" data-render="text" hidden></pre>
      <p class="tool__error" data-ref="error" hidden></p>
      <p class="tool__note" data-ref="note" hidden>… 已截断，完整内容在 transcript</p>
    </details>
  </div>
</template>

<template id="tpl-notice">
  <div class="event">
    <p class="notice" data-ref="notice" data-tone="muted"></p>
  </div>
</template>

</body>
</html>
